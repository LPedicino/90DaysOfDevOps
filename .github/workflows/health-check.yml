name: Health Check

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          docker run -d -p 8080:80 --name temp-app ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

      - name: Wait for container to start
        run: sleep 5

      - name: Check health endpoint
        run: |
          curl --fail http://localhost:8080 || exit 1

      - name: Generate Health Check Report
        if: always()
        run: |
          echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest" >> $GITHUB_STEP_SUMMARY
          echo "- Status: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup container
        if: always()
        run: |
          docker stop temp-app || true
          docker rm temp-app || true
