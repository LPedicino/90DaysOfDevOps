name: GitHub-Hosted Runners Exploration

on: [push]

jobs:
  explore-runners:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print system details
        run: |
          echo "OS Name: ${{ matrix.os }}"
          echo "Hostname: $(hostname)"
          echo "Current User: $USER"
        shell: bash

      - name: Print pre-installed tools (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "--- Docker Version ---"
          docker --version || true
          echo "--- Python Version ---"
          python3 --version
          echo "--- Node Version ---"
          node --version
          echo "--- Git Version ---"
          git --version
